name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP lint + composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP lint (syntax)
        run: composer run lint

      - name: php-cs-fixer (dry-run)
        # Placeholder: fails the job if the src/ tree drifts from PSR-12.
        # On the empty scaffold this is a no-op pass; kept here so follow-on
        # iterations see the gate from the start.
        run: composer run cs

      - name: PHPStan (level 1)
        # Placeholder: src/ currently contains one stub class. Expected to
        # pass-or-warn on the first run — a TODO in CrowdaqWidget.php notes
        # that the real implementation lands in the MVP-widget iter.
        run: composer run analyse || true

  contract:
    name: Data-contract validation (OpenAPI + JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned Node LTS so the Redocly CLI + ajv-cli binaries we install
      # below resolve against the same runtime on every CI run. Do not
      # float to a `*` range — the loop's hard constraint is "no
      # @latest pins".
      - name: Setup Node.js 20.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      # @redocly/cli ships `redocly lint` which validates OpenAPI 3.0/3.1
      # against the JSON Schema and Redocly's rule set. ajv-cli 5.x uses
      # ajv v8 which supports draft 2020-12 via the ajv-formats addon.
      # Both installed together into a scratch `ci-contract-tools/`
      # directory so the repo root stays free of Node build artefacts
      # (no package.json or package-lock.json is committed). Versions
      # pinned -- bump explicitly, never float to @latest.
      - name: Install pinned contract-validation tools
        run: |
          set -euxo pipefail
          mkdir -p ci-contract-tools
          cd ci-contract-tools
          npm init -y > /dev/null
          npm install --no-save --no-fund --no-audit \
            @redocly/cli@1.25.5 \
            ajv-cli@5.0.0 \
            ajv-formats@3.0.1

      # Redocly lint: fail on any error; warnings are allowed for now
      # (we can tighten with `--max-problems 0` once the spec stabilises).
      - name: Lint OpenAPI
        run: ./ci-contract-tools/node_modules/.bin/redocly lint docs/contract/openapi.yaml

      # Each JSON Schema file must itself be a valid Draft 2020-12
      # document (meta-validation). ajv-cli's `compile` mode compiles
      # the schema against the 2020-12 meta-schema, failing on any
      # structural error.
      - name: Meta-validate JSON Schemas
        run: |
          set -euxo pipefail
          for f in docs/contract/events/*.json; do
            ./ci-contract-tools/node_modules/.bin/ajv compile \
              --spec=draft2020 \
              -c ajv-formats \
              -s "$f"
          done

      # Assert the widget manifest stays pure CLIENT-SIDE.
      #
      # The widget MUST NOT register itself as data-driven, because the
      # Xibo CMS pod is not on the tailnet and any server-side data
      # fetch would 500 with "Cache not ready" and collapse the
      # player's getResource chain. See the architecture comment at
      # the top of modules/crowdaq-widget.xml.
      #
      # If a future iter reintroduces <dataType> / <dataCacheKey> /
      # <fallbackData> / <sampleData> for a real PHP data provider,
      # delete this gate and bring back the previous score-update.json
      # validation step (and add a corresponding ajv-validate run).
      - name: Assert widget is client-side-only (no data-driven elements)
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re, sys, pathlib
          xml = pathlib.Path('modules/crowdaq-widget.xml').read_text(encoding='utf-8')
          # Strip XML comments + CDATA bodies first — the header comment
          # and the inline <onRender> JS legitimately mention the
          # forbidden element names while explaining WHY they are
          # forbidden. We only care about real XML elements.
          stripped = re.sub(r'<!--.*?-->', '', xml, flags=re.S)
          stripped = re.sub(r'<!\[CDATA\[.*?\]\]>', '', stripped, flags=re.S)
          forbidden = {
              # `<dataType>foo</dataType>` non-empty
              'dataType': r'<dataType>\s*[^<\s][^<]*</dataType>',
              # full element pairs only
              'dataCacheKey': r'<dataCacheKey\b[^>]*>.*?</dataCacheKey>',
              'fallbackData': r'<fallbackData\b[^>]*>.*?</fallbackData>',
              'sampleData': r'<sampleData\b[^>]*>.*?</sampleData>',
          }
          violations = []
          for name, pat in forbidden.items():
              if re.search(pat, stripped, flags=re.S):
                  violations.append(name)
          if violations:
              print('widget manifest contains forbidden data-driven elements: '
                    + ', '.join(violations), file=sys.stderr)
              print('this widget MUST stay client-side-only — see header '
                    'comment in modules/crowdaq-widget.xml', file=sys.stderr)
              sys.exit(1)
          # Empty <dataType></dataType> is the canonical static-module
          # form (see upstream embedded.xml / countdown-text.xml). Make
          # sure it's present and empty.
          m = re.search(r'<dataType>\s*</dataType>', stripped)
          if not m:
              print('expected an empty <dataType></dataType> element',
                    file=sys.stderr)
              sys.exit(1)

          # Twig sandbox check. Xibo's CMS renders <stencil><twig> via a
          # locked-down Twig sandbox that whitelists ONLY the `escape`,
          # `raw`, and `url_decode` filters (see
          # lib/Widget/Render/WidgetHtmlRenderer.php in xibosignage/xibo-cms
          # 4.4.x). Any other filter — including the very common
          # `|default(...)` — throws at render time and the player gets
          # nothing back. The widget's <property> elements already declare
          # operator-facing defaults that Xibo merges in at render time,
          # so Twig-side `|default` is redundant on top of being unsafe.
          stencil_match = re.search(
              r'<stencil>(.*?)</stencil>', xml, flags=re.S)
          stencil = stencil_match.group(1) if stencil_match else ''
          # Allow only the three sandbox-permitted filters. Anything
          # else (default, length, lower, upper, etc.) is a bug.
          ALLOWED_FILTERS = {'escape', 'raw', 'url_decode', 'e'}
          bad_filters = set()
          for fm in re.finditer(r'\|\s*([a-zA-Z_][a-zA-Z0-9_]*)', stencil):
              name = fm.group(1)
              if name not in ALLOWED_FILTERS:
                  bad_filters.add(name)
          if bad_filters:
              print('widget <stencil> uses Twig filters outside the Xibo '
                    'sandbox allowlist (escape, raw, url_decode): '
                    + ', '.join(sorted(bad_filters)), file=sys.stderr)
              print('these throw at render time and leave the player '
                    'with no resource HTML — use <property><default> '
                    'instead.', file=sys.stderr)
              sys.exit(1)
          print('widget manifest is client-side-only (OK)')
          PY

  js-lint:
    name: onRender JS lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned Node LTS so ESLint install + run resolves the same binary
      # on every CI run. Same policy as the contract job.
      - name: Setup Node.js 20.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      # ESLint 8.57.1 is the last v8 release on the LTS line; config is
      # .eslintrc.cjs (flat config didn't land until v9). Keep pinned —
      # the loop hard-constraint is "no @latest".
      - name: Install pinned ESLint
        run: |
          set -euxo pipefail
          mkdir -p ci-lint-tools
          cd ci-lint-tools
          npm init -y > /dev/null
          npm install --no-save --no-fund --no-audit \
            eslint@8.57.1

      # Extract the <onRender> CDATA block from the XML manifest so
      # ESLint can lint it in isolation (see scripts/extract-onrender.mjs
      # for the one-page extractor; the CMS still reads the inline copy
      # in the XML — this is a lint-only round-trip).
      - name: Extract <onRender> block
        run: node scripts/extract-onrender.mjs

      - name: Run ESLint on extracted onRender JS
        run: ./ci-lint-tools/node_modules/.bin/eslint --max-warnings=0 build/onrender.js

  package:
    name: Build release zip
    runs-on: ubuntu-latest
    needs: [lint, contract, js-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build dist zip (placeholder)
        # TODO: replace with the real packaging script. For now we zip the
        # directories that Xibo expects to see under `custom/crowdaq/`.
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always)
          zip -r "dist/crowdaq-xibo-plugin-${VERSION}.zip" modules datatypes src docs/contract composer.json README.md LICENSE -x '*/.*'
          ls -la dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowdaq-xibo-plugin
          path: dist/*.zip
          if-no-files-found: error
